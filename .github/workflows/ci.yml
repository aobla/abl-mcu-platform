name: platform

# CI платформы:
#   - host-tests: тесты на native (быстро, без тулчейнов и SDK);
#   - build-components: сборка портов HAL под МК-платформы.
#
# ВАЖНО про сборку под МК: платформа сама тулчейн не выбирает — это делает
# проект (CMAKE_TOOLCHAIN_FILE). Поэтому здесь тулчейн подключается явно, а
# vendor-SDK ставится из manifest.yml (иначе нет заголовков вида stm32f1xx_hal.h).
# Полная проверка «прошивка под платформу» живёт в CI проекта
# (abl-mcu-project-*/.github/workflows/ci.yml).

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host tests (native + codegen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 python3-yaml python3-jinja2

      # git хранит режим файла: если бит +x потерян, шаг упадёт с "Permission
      # denied" вместо понятной диагностики. Проверяем это первым.
      - name: Check script permissions
        run: |
          for f in scripts/*.sh scripts/*.py tests/*.py; do
            if [ ! -x "$f" ]; then
              echo "::error file=$f::script is not executable (git mode 100644). Fix: chmod +x $f && git update-index --chmod=+x $f"
              exit 1
            fi
          done
          echo "all scripts are executable"

      - name: Run host tests
        run: ./scripts/run_host_tests.sh

  build-components:
    name: Build components (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: native
            packages: ""
            toolchain: ""
            sdk: ""
            cmake_extra: ""
          - platform: avr
            packages: gcc-avr avr-libc
            toolchain: cmake/toolchains/avr-gcc.cmake
            sdk: ""
            cmake_extra: "-DAVR_MCU=atmega328p -DF_CPU_HZ=16000000"
          - platform: stm32f103
            packages: gcc-arm-none-eabi
            toolchain: cmake/toolchains/stm32-gcc.cmake
            sdk: stm32f1-hal
            # CPU/FPU/ABI normally come from the project, which resolves them from
            # mcu.part through cmake/helpers/soc.cmake; a standalone platform build
            # passes them explicitly.
            cmake_extra: "-DMCU_PART=STM32F103C6T6 -DABL_SOC_FAMILY=f1 -DSTM32_MCU=cortex-m3 -DSTM32_FPU= -DSTM32_FLOAT_ABI=soft"
          - platform: stm32h743
            packages: gcc-arm-none-eabi
            toolchain: cmake/toolchains/stm32-gcc.cmake
            sdk: stm32h7-hal
            cmake_extra: "-DMCU_PART=STM32H743VIT6 -DABL_SOC_FAMILY=h7 -DSTM32_MCU=cortex-m7 -DSTM32_FPU=fpv5-sp-d16 -DSTM32_FLOAT_ABI=hard"
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 python3-yaml python3-jinja2 ${{ matrix.packages }}

      # Компоненты платформы включают vendor-заголовки (soc_hal.h → stm32f1xx_hal.h),
      # поэтому SDK обязателен. Версии берутся из manifest.yml.
      - name: Install vendor SDK from manifest
        if: matrix.sdk != ''
        run: ./scripts/install_sdk.py ${{ matrix.sdk }}

      # Ключевые заголовки CMSIS: без них сборка падает невнятным
      # "core_cmX.h: No such file or directory". Раскладку проверяет сам
      # установщик (у него include_dirs из манифеста), здесь — краткая сводка.
      #
      # NOTE: путь берётся из манифеста через install_sdk.py --print-path.
      # В workflow-выражениях НЕТ контекста env.HOME (частая ошибка: он даёт
      # пустую строку и путь вида /.local/...), поэтому $HOME читает shell.
      - name: Verify SDK layout
        if: matrix.sdk != ''
        run: |
          SDK_DIR="$(./scripts/install_sdk.py ${{ matrix.sdk }} --print-path)"
          echo "SDK: $SDK_DIR"

          case "${{ matrix.sdk }}" in
            stm32f1-hal) HAL=stm32f1xx_hal.h; CORE=core_cm3.h ;;
            stm32h7-hal) HAL=stm32h7xx_hal.h; CORE=core_cm7.h ;;
          esac

          echo "--- SDK tree (2 levels) ---"
          find "$SDK_DIR" -maxdepth 2 -type d | sort | head -20

          fail=0
          for p in "$SDK_DIR/Inc/$HAL" \
                   "$SDK_DIR/CMSIS/Device/Include" \
                   "$SDK_DIR/CMSIS/CMSIS/Core/Include/$CORE"; do
            if [ -e "$p" ]; then
              echo "  ok   $p"
            else
              echo "::error::$p is missing — SDK layout is wrong"
              fail=1
            fi
          done
          exit $fail

      - name: Configure components
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DPLATFORM=${{ matrix.platform }} \
            ${{ matrix.toolchain && format('-DCMAKE_TOOLCHAIN_FILE={0}', matrix.toolchain) || '' }} \
            ${{ matrix.cmake_extra }}
          cmake --build build-ci
