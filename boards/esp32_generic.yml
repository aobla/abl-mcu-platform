# Board-дефиниция: обобщённая плата ESP32
#
# Сборка идёт через обёртку ESP-IDF (target/esp32, Шаг 9).

board:
  name: esp32_generic
  description: "Обобщённая плата ESP32, 240 МГц"

platform: esp32
mcu:
  part: ESP32
cpu: xtensa-lx6

frequencies:
  cpu: 240000000            # -> CPU_FREQ
  apb: 80000000             # -> APB_FREQ

memory:
  flash: 4194304
  ram: 524288

# Для ESP32 port — номер GPIO (см. hal/src/esp32).
onboard:
  led0:      { port: 2, pin: 0, mode: output }
  usart1_tx: { port: 1, pin: 0, mode: alt_function }
  usart1_rx: { port: 3, pin: 0, mode: alt_function }
