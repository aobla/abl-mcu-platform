# Board-дефиниция: обобщённая плата STM32F4 (перенос из проекта, Шаг 5)
#
# TODO: SoC-дефиниция для F4 пока не создана (нужен startup/system/линкер/hal_conf
# и SDK stm32f4-hal). До этого сборка под эту плату невозможна — резолвер честно
# сообщит о неизвестном mcu.part.

board:
  name: stm32f4_generic
  description: "Обобщённая плата STM32F407, HSE 8 МГц"

platform: stm32f4
mcu:
  part: STM32F407VGT6
cpu: cortex-m4

oscillator:
  source: hse
  freq_hz: 8000000

frequencies:
  hclk: 168000000
  pclk1: 42000000
  pclk2: 84000000

memory:
  flash: 1048576
  ram: 131072

onboard:
  led0:      { port: GPIOA, pin: 5,  mode: output, state: low }
  usart1_tx: { port: GPIOA, pin: 9,  mode: alt_function }
  usart1_rx: { port: GPIOA, pin: 10, mode: alt_function }
